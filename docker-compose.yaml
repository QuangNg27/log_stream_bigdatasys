version: '3.8'

services:
  # 1. CSDL Nguồn PostgreSQL (Có bật Logical Replication cho CDC)
  postgres-source:
    image: postgres:15-alpine
    container_name: postgres-source
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin@123
      POSTGRES_DB: app_db
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data

  postgres-big-data:
    image: postgres:15-alpine
    container_name: postgres-big-data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin@123
      POSTGRES_DB: bigdata_db
    volumes:
      - postgres_bigdata_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80" # Truy cập UI qua: http://localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Admin@123
    depends_on:
      - postgres-source
      - postgres-big-data

  # 2. Apache Kafka Broker (Chạy chế độ KRaft)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data

  # 3. Confluent Schema Registry
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"

      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # 4. Kafka Connect tích hợp sẵn Debezium Plugin
  kafka-connect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kafka-connect
    ports:
      - "8083:8083"
    command: /etc/confluent/docker/run
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

      # BẮT BUỘC PHẢI CÓ TIỀN TỐ CONNECT_ CHO MỌI BIẾN MÔI TRƯỜNG
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_PORT: '8083'
      CONNECT_REST_ADVERTISED_HOST_NAME: 'kafka-connect'
      CONNECT_GROUP_ID: 'connect-cluster'
      CONNECT_CONFIG_STORAGE_TOPIC: 'connect-configs'
      CONNECT_OFFSET_STORAGE_TOPIC: 'connect-offsets'
      CONNECT_STATUS_STORAGE_TOPIC: 'connect-statuses'
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: '1'
      
      # Cấu hình Avro Converter
      CONNECT_KEY_CONVERTER: 'io.confluent.connect.avro.AvroConverter'
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      CONNECT_VALUE_CONVERTER: 'io.confluent.connect.avro.AvroConverter'
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      
      # Đường dẫn chứa Plugins
      CONNECT_PLUGIN_PATH: '/usr/share/java,/usr/share/confluent-hub-components'

    deploy:
      resources:
        limits:
          memory: 1g

  kafka-connect-init:
    image: curlimages/curl:latest
    container_name: kafka-connect-init
    depends_on:
      - kafka-connect
    volumes:
      - ./register-debezium.sh:/register-debezium.sh
      - ./sink-connector.sh:/sink-connector.sh
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Waiting for Kafka Connect to be ready..."
        until curl -s -f http://kafka-connect:8083/connectors > /dev/null; do
          sleep 3
        done
        echo "Kafka Connect is ready! Auto-registering Source & Sink connectors for all tables..."
        
        for tbl in users devices cam_bills; do
          echo ">>> [1/2] Registering Debezium Source for: public.$$tbl"
          sh /register-debezium.sh --connect-host=kafka-connect --connect-port=8083 --table=public.$$tbl
          
          echo ">>> [2/2] Registering JDBC Sink for: $$tbl"
          sh /sink-connector.sh --connect-host=kafka-connect --connect-port=8083 --table=$$tbl --topic=cdc_data.public.$$tbl
        done
        
        echo "All Source & Sink connectors registered successfully!"

  # 5. UI quản lý Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"   # Web UI HDFS
      - "9000:9000"   # Port HDFS IPC
    environment:
      - CLUSTER_NAME=hadoop-cluster
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_namenode_data:/hadoop/dfs/name

  # --- BỔ SUNG: HADOOP DATANODE ---
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    ports:
      - "9864:9864"
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode_data:/hadoop/dfs/data

  # --- SPARK MASTER (APACHE OFFICIAL) ---
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    depends_on:
      - namenode
    ports:
      - "8085:8080"   # Spark Web UI Master
      - "7077:7077"   # Port Spark Master IPC
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./spark-apps:/opt/spark-apps
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.master.Master"

  # --- SPARK WORKER (APACHE OFFICIAL) ---
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
  
  # 6. Workflow Automation & Notification (n8n)
  # n8n:
  #   image: docker.n8n.io/n8nio/n8n:latest
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - "5678:5678"
  #   environment:
  #     - N8N_HOST=localhost
  #     - N8N_PORT=5678
  #     - N8N_PROTOCOL=http
  #     - NODE_ENV=production
  #     - WEBHOOK_URL=http://localhost:5678/
  #     - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
  #     - TZ=Asia/Ho_Chi_Minh
  #   volumes:
  #     - n8n_data:/home/node/.n8n

  # 9. Business Intelligence & Reporting Dashboard (Apache Superset)
  superset:
    image: apache/superset:3.1.0
    container_name: superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=superset_secret_key_antigravity_123456
      - TALISMAN_ENABLED=False
    volumes:
      - superset_data:/app/superset_home
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Initializing Apache Superset..."
        pip install clickhouse-connect
        superset db upgrade
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@lakehouse.com --password admin || true
        superset init
        /usr/bin/run-server.sh

  # 10. Gold Layer / High-Speed OLAP Engine (ClickHouse)
  clickhouse:
    image: clickhouse/clickhouse-server:25.9
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP Web / Superset / DBeaver HTTP
      - "9009:9000"   # Native TCP protocol
    environment:
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=Admin@123
      - CLICKHOUSE_DB=gold_db
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # 11. Source & Landing Object Storage (MinIO S3 - Local Image)
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # MinIO Web Console UI
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=Admin@123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init-buckets:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: minio-init-buckets
    depends_on:
      - minio
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Waiting for MinIO to start..."
        sleep 5
        mkdir -p /data/source-logs-bucket/incoming /data/source-logs-bucket/processed /data/source-files-bucket/incoming /data/source-files-bucket/processed
        echo "Source S3 Buckets created successfully in MinIO!"
    volumes:
      - minio_data:/data

  # 12. DataFlow / Batching & Direct Ingestion (Apache NiFi - Local Image)
  nifi:
    image: apache/nifi:1.28.0
    container_name: nifi
    restart: unless-stopped
    ports:
      - "8443:8443"   # NiFi Web HTTPS UI
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=Admin@123456789
      - NIFI_JVM_HEAP_INIT=512m
      - NIFI_JVM_HEAP_MAX=1024m
    volumes:
      - nifi_data:/opt/nifi/nifi-current/conf

  # 13. Search Engine / OpenMetadata Backend (Elasticsearch - Local Image)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.1
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # 14. Scheduler & Pipeline Orchestration (Apache Airflow - New Image)
  airflow:
    image: apache/airflow:2.8.3
    container_name: airflow
    restart: unless-stopped
    ports:
      - "8089:8080"   # Airflow Web UI: http://localhost:8089
    depends_on:
      - postgres-big-data
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:Admin@123@postgres-big-data:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=airflow_secret_key_antigravity_123456
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=Admin@123
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark-apps:/opt/spark-apps
      - ./data_lake_source:/opt/data_lake_source

  # 15. Enterprise Data Governance Hub (OpenMetadata Server - New Image)
  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.3.1
    container_name: openmetadata-server
    restart: unless-stopped
    ports:
      - "8585:8585"   # OpenMetadata Web UI: http://localhost:8585
    depends_on:
      - postgres-big-data
      - elasticsearch
    environment:
      - SERVER_PORT=8585
      - DB_HOST=postgres-big-data
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=Admin@123
      - DB_DATABASE=openmetadata_db
      - SEARCH_HOST=elasticsearch
      - SEARCH_PORT=9200
      - SEARCH_SCHEMA=http
      - SEARCH_TYPE=elasticsearch
      - AUTHENTICATION_PROVIDER=openmetadata
      - AUTHORIZER_CLASS_NAME=org.openmetadata.service.security.DefaultAuthorizer
      - AIRFLOW_HOST=airflow
      - AIRFLOW_PORT=8080
    volumes:
      - openmetadata_data:/opt/openmetadata

  openmetadata-ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:1.3.1
    container_name: openmetadata-ingestion
    depends_on:
      - openmetadata-server
    environment:
      - OPENMETADATA_SERVER_URL=http://openmetadata-server:8585/api

volumes:
  postgres_source_data:
  postgres_bigdata_data:
  kafka_data:
  hadoop_namenode_data:
  hadoop_datanode_data:
  superset_data:
  clickhouse_data:
  # n8n_data:
  minio_data:
  nifi_data:
  elasticsearch_data:
  openmetadata_data: